[package]
name = "openinfer-kimi-k2"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
autobenches = false
autobins = false
autotests = false

[dependencies]
anyhow = { workspace = true }
bytesize = { workspace = true }
clap = { workspace = true, optional = true }
crossbeam-channel = { workspace = true }
cudarc = { workspace = true, features = ["nccl"] }
half = { workspace = true }
log = { workspace = true }
memmap2 = { workspace = true }
openinfer-bench = { workspace = true }
openinfer-core = { workspace = true }
openinfer-kernels = { workspace = true }
openinfer-sample = { workspace = true }
openinfer-kv-cache = { workspace = true }
rand = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[features]
default = []
kimi-k2 = ["openinfer-kernels/kimi-k2"]
kernel-call-trace = ["openinfer-core/kernel-call-trace"]
kernel-report = [
    "dep:clap",
    "kimi-k2",
    "kernel-call-trace",
]

[dev-dependencies]
openinfer-vllm-support = { workspace = true }
vllm-text = { workspace = true }

[[test]]
name = "vllm_golden_gate"
path = "tests/vllm_golden_gate.rs"
required-features = ["kimi-k2"]

# Serving-contract integration tests ported from openinfer-qwen3-4b (#222).
# No `required-features`: the test bodies call `start_engine`, which is defined
# for both feature configs (feature-off stub bails), so they type-check and
# skip cleanly without the kimi-k2 runtime built.
[[test]]
name = "sampling_behavior"
path = "tests/sampling_behavior.rs"

[[test]]
name = "context_window"
path = "tests/context_window.rs"

[[test]]
name = "context_window_in_window"
path = "tests/context_window_in_window.rs"

[[test]]
name = "scheduler_robustness"
path = "tests/scheduler_robustness.rs"

[[test]]
name = "cached_tokens_usage"
path = "tests/cached_tokens_usage.rs"

[[bin]]
name = "kimi_kernel_report"
path = "src/bin/kimi_kernel_report.rs"
required-features = ["kernel-report"]

[[bin]]
name = "kimi_model_report"
path = "src/bin/kimi_model_report.rs"
required-features = ["kernel-report"]

[lints]
workspace = true
